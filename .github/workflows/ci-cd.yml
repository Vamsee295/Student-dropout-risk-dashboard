name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest pytest-asyncio

      - name: Lint with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest
        run: |
          cd backend
          pytest tests/

  build-and-validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Type Check & Lint
        run: |
          cd frontend
          npm run lint || echo "Lint warnings"
          npx tsc --noEmit || echo "Typescript check"

      - name: Build Next.js Bundle
        run: |
          cd frontend
          npm run build

  docker-build-and-push:
    needs: [test-and-lint-backend, build-and-validate-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Backend Image
        run: docker build -t edurisk-backend ./backend

      - name: Build Frontend Image
        run: docker build -t edurisk-frontend ./frontend

      - name: Build Nginx Image
        run: docker build -t edurisk-nginx ./nginx

      - name: Simulate Push to Registry
        run: |
          echo "In a real environment, you would run docker login and docker push here."
          echo "docker tag edurisk-backend user/edurisk-backend:latest"
          echo "docker push user/edurisk-backend:latest"

  deploy-to-production:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Simulate Deployment via SSH
        run: |
          echo "Deploying to production server..."
          echo "ssh user@production-server 'cd /opt/edurisk && git pull && docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build'"
          echo "Deployment successful."
