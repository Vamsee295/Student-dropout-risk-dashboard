<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Book Outer Cover -->
  <path d="M12 28 C12 28, 28 20, 50 25 C72 20, 88 28, 88 28 L88 78 C88 78, 70 70, 50 75 C30 70, 12 78, 12 78 Z" 
        stroke="#0F2B48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Book Spine Center Line -->
  <line x1="50" y1="25" x2="50" y2="75" stroke="#0F2B48" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Left Page Fold Detail -->
  <path d="M18 34 C26 27, 38 28, 47 31 L47 70 C38 67, 26 66, 18 72 Z" 
        stroke="#0F2B48" stroke-width="3" stroke-linejoin="round" fill="none"/>
        
  <!-- Right Page Fold Detail -->
  <path d="M82 34 C74 27, 62 28, 53 31 L53 70 C62 67, 74 66, 82 72 Z" 
        stroke="#0F2B48" stroke-width="3" stroke-linejoin="round" fill="none"/>

  <!-- Left Side: Neural Network Graph Lines -->
  <line x1="33" y1="42" x2="43" y2="48" stroke="#0F2B48" stroke-width="2.5"/>
  <line x1="33" y1="42" x2="35" y2="58" stroke="#0F2B48" stroke-width="2.5"/>
  <line x1="35" y1="58" x2="44" y2="65" stroke="#0F2B48" stroke-width="2.5"/>
  <line x1="43" y1="48" x2="35" y2="58" stroke="#0F2B48" stroke-width="2.5"/>
  <line x1="43" y1="48" x2="50" y2="54" stroke="#0F2B48" stroke-width="2.5"/>
  <line x1="44" y1="65" x2="50" y2="54" stroke="#0F2B48" stroke-width="2.5"/>

  <!-- Left Side: Neural Network Nodes (Cyan) -->
  <circle cx="33" cy="42" r="3.5" fill="#38BDF8" stroke="#0F2B48" stroke-width="1.5"/>
  <circle cx="35" cy="58" r="3.5" fill="#38BDF8" stroke="#0F2B48" stroke-width="1.5"/>
  <circle cx="43" cy="48" r="2" fill="#0F2B48"/>
  <circle cx="44" cy="65" r="2" fill="#0F2B48"/>

  <!-- Right Side: Upward Growth Arrow Rising from Center Spine -->
  <line x1="46" y1="68" x2="70" y2="40" stroke="#0F2B48" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Arrow Head -->
  <polygon points="73,36 60,39 67,46" fill="#0F2B48"/>
</svg>
